# API server-to-server do parceiro: auth por header x-api-key + secret em env var
# (verify_jwt=false — sem isso o gateway barra antes do código).
[functions.partner-checkin]
verify_jwt = false

# Captura da foto facial no cadastro: exige usuário logado (o path da foto vem do
# id do token, não do body).
[functions.facial-enroll]
verify_jwt = true

# Check-in facial na portaria: quem chama é o servidor do Marcel, sem sessão
# Supabase (verify_jwt=false — com true o gateway barraria antes do código). A
# autenticação é por header x-api-key comparado ao secret MARCEL_CHECKIN_KEY;
# sem o secret no ambiente a função recusa tudo, nunca fica aberta.
[functions.facial-checkin]
verify_jwt = false

# Reenvio administrativo das faciais pendentes pro Marcel: chamada server-to-server
# (cron/operação), sem sessão de usuário — daí verify_jwt=false. Autentica por
# header x-api-key contra o secret FACIAL_RESYNC_KEY; sem o secret, recusa tudo.
[functions.facial-resync]
verify_jwt = false

# Consulta de CPF/CNPJ na API do Marcel para o cadastro de produtor. Público de
# propósito: quem se cadastra ainda não tem conta, então não há JWT para exigir.
# A trava é rate limit por IP dentro da função + validação de dígito verificador
# antes de qualquer chamada externa. A URL da API vive no secret MARCEL_DOC_BASE.
[functions.document-lookup]
verify_jwt = false

# Diagnóstico da integração de pagamentos (API do Marcel). Só consulta opções de
# parcelamento — nunca cria cobrança. verify_jwt=true: é ferramenta de operação,
# não rota pública.
[functions.marcel-health]
verify_jwt = true

# Cobrança PIX pela API do Marcel.
# ⚠️ verify_jwt=true, CORRIGIDO em 18/08. Nasceu `false` com a justificativa de que
# "a compra de ingresso não exige login" — e isso é FALSO: o EventDetails abre o
# modal de login antes do checkout. Aberta, ela deixava qualquer um criar pedidos
# em massa, e cada pedido RESERVA estoque por 30 min: esgota-se um lote de graça.
# As rotas equivalentes (create-mercadopago-pix, confra-create-pix) sempre foram true.
[functions.marcel-create-pix]
verify_jwt = true

# Consulta do PIX — é ela que aprova o pedido, já que a API do Marcel não tem
# webhook. A promoção passa pela RPC idempotente, então consultar à vontade é
# seguro; mesmo assim exige login (18/08), porque a resposta diz se um pedido
# qualquer foi pago e isso não é informação de rota aberta.
[functions.marcel-check-pix]
verify_jwt = true

# Cobrança no crédito pela API do Marcel.
# ⚠️ verify_jwt=true, CORRIGIDO em 18/08. Aberta, esta era a pior das três: recebe
# número de cartão e repassa à adquirente com a NOSSA chave — ou seja, qualquer um
# na internet podia usá-la para testar listas de cartões roubados, e a conta da
# FestPag levaria os chargebacks e a marca de origem de fraude.
# Aceita `quote:true` para cotar as parcelas sem criar nada — necessário porque a API recusa a venda inteira se a
# parcela ficar abaixo de R$5, e a tela não pode oferecer opção que será negada.
[functions.marcel-process-card]
verify_jwt = true

# Cobrança PIX de MESA/CAMAROTE pela rota do Marcel. Gêmea da create-seat-pix.
# verify_jwt=true: mesa é presa ao usuário desde o mapa (held_by_user_id), então
# compra anônima não existe aqui nem faria sentido.
[functions.marcel-create-seat-pix]
verify_jwt = true

# Cobrança no crédito de MESA/CAMAROTE. Aceita `quote:true` para cotar as
# parcelas sem prender mesa nenhuma — cotar pela RPC de criação seguraria o
# camarote de quem só está olhando o preço.
[functions.marcel-charge-seat-card]
verify_jwt = true

# Vigia de contestação e estorno na rota do Marcel. A API deles NÃO tem webhook,
# e a varredura de confirmação só olha pedido pendente — nenhuma rotina olhava
# pedido PAGO, então uma venda estornada seguia como paga para sempre. Esta só
# MARCA para análise e avisa a equipe; não desfaz nada (decisão do Gabriel:
# contestação vai para análise humana). Cron horário, autentica por x-api-key.
[functions.marcel-vigia-estornos]
verify_jwt = false

# Varredura de pedidos pagos que ninguém confirmou. Como a API do Marcel não tem
# webhook, ESTA função é o webhook: sem ela, cliente que paga e fecha a aba fica
# com o pedido pendente para sempre. Chamada por cron, autentica por
# x-api-key contra MARCEL_RECONCILE_KEY — sem o secret, recusa tudo.
[functions.marcel-reconcile]
verify_jwt = false

# Ponte READ-ONLY para o sistema de gestão. verify_jwt = false porque quem chama é o
# servidor da gestão com o token de serviço (x-service-token), não um navegador logado —
# a própria função recusa qualquer chamada sem o token, antes de tocar no banco.
[functions.gestao-sales-export]
verify_jwt = false

# API server-to-server do parceiro: auth por header x-api-key + secret em env var
# (verify_jwt=false — sem isso o gateway barra antes do código).
[functions.partner-checkin]
verify_jwt = false

# Captura da foto facial no cadastro: exige usuário logado (o path da foto vem do
# id do token, não do body).
[functions.facial-enroll]
verify_jwt = true

# Check-in facial na portaria: quem chama é o servidor do Marcel, sem sessão
# Supabase (verify_jwt=false — com true o gateway barraria antes do código). A
# autenticação é por header x-api-key comparado ao secret MARCEL_CHECKIN_KEY;
# sem o secret no ambiente a função recusa tudo, nunca fica aberta.
[functions.facial-checkin]
verify_jwt = false

# Reenvio administrativo das faciais pendentes pro Marcel: chamada server-to-server
# (cron/operação), sem sessão de usuário — daí verify_jwt=false. Autentica por
# header x-api-key contra o secret FACIAL_RESYNC_KEY; sem o secret, recusa tudo.
[functions.facial-resync]
verify_jwt = false

# Consulta de CPF/CNPJ na API do Marcel para o cadastro de produtor. Público de
# propósito: quem se cadastra ainda não tem conta, então não há JWT para exigir.
# A trava é rate limit por IP dentro da função + validação de dígito verificador
# antes de qualquer chamada externa. A URL da API vive no secret MARCEL_DOC_BASE.
[functions.document-lookup]
verify_jwt = false

# Diagnóstico da integração de pagamentos (API do Marcel). Só consulta opções de
# parcelamento — nunca cria cobrança. verify_jwt=true: é ferramenta de operação,
# não rota pública.
[functions.marcel-health]
verify_jwt = true

# Cobrança PIX pela API do Marcel. verify_jwt=false porque a compra de ingresso
# não exige login (mesmo padrão das outras rotas de criação de cobrança).
[functions.marcel-create-pix]
verify_jwt = false

# Consulta do PIX — é ela que aprova o pedido, já que a API do Marcel não tem
# webhook. Pública pelo mesmo motivo da criação; a promoção passa pela RPC
# idempotente, então consultar à vontade é seguro.
[functions.marcel-check-pix]
verify_jwt = false

# Cobrança no crédito pela API do Marcel. Aceita `quote:true` para cotar as
# parcelas sem criar nada — necessário porque a API recusa a venda inteira se a
# parcela ficar abaixo de R$5, e a tela não pode oferecer opção que será negada.
[functions.marcel-process-card]
verify_jwt = false

# Varredura de pedidos pagos que ninguém confirmou. Como a API do Marcel não tem
# webhook, ESTA função é o webhook: sem ela, cliente que paga e fecha a aba fica
# com o pedido pendente para sempre. Chamada por cron, autentica por
# x-api-key contra MARCEL_RECONCILE_KEY — sem o secret, recusa tudo.
[functions.marcel-reconcile]
verify_jwt = false
